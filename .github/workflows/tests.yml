name: SEI tests

on:
  push:
    branches:
      - main
      - feature/multi-agent-chat
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: >-
          python -m py_compile
          sei.py sei_agents.py sei_runtime.py sei_router.py
          macro_data.py macro_analysis.py sei_macro_runtime.py streamlit_app.py

  official-api-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test ECB, Eurostat, INE and OECD public APIs
        env:
          SEI_LIVE_API_TESTS: "1"
        run: python -m unittest tests.test_macro_live -v
